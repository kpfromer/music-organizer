[workspace]
resolver = "3"
members = [
    "crates/mm-config",
    "crates/mm-entities",
    "crates/mm-migrate",
    "crates/mm-storage",
    "crates/mm-import",
    "crates/mm-library",
    "crates/mm-playlist",
    "crates/mm-wishlist",
    "crates/mm-matching",
    "crates/mm-playback",
    "crates/mm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
authors = ["Kyle Pfromer <kpfromer2@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"

# Errors
thiserror = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# GraphQL
async-graphql = { version = "7", features = ["dataloader", "tracing"] }
async-graphql-axum = "7"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
include_dir = "0.7"
parking_lot = "0.12"
governor = "0.6"
notify = "8"
async-channel = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
