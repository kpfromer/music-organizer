pre-commit:
  parallel: true
  commands:
    fmt-rust:
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
    fmt-ts:
      glob: "*.{ts,tsx,js,jsx,json}"
      root: "frontend/"
      run: pnpm biome format --write {staged_files}
      stage_fixed: true
    lint-ts:
      glob: "*.{ts,tsx}"
      root: "frontend/"
      run: pnpm biome lint {staged_files}
    secrets:
      run: scripts/check-secrets.sh {staged_files}
