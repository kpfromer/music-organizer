name: v2-ci

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.forgejo/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.forgejo/workflows/v2-ci.yml'

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Install node (for actions runtime)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: rustup component
        run: rustup component add rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  rust-build:
    name: Rust build
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Install node (for actions runtime)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-
      - name: cargo build
        run: cargo build --workspace --all-targets

  rust-test:
    name: Rust test
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Install node (for actions runtime)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: cargo test
        run: cargo test --workspace --all-targets

  rust-clippy:
    name: Rust clippy
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Install node (for actions runtime)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-
      - name: rustup component
        run: rustup component add clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-shear:
    name: Rust cargo-shear
    runs-on: docker
    container:
      image: rust:1.95-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Install node (for actions runtime)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-shear-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shear-
      - name: Install cargo-shear
        run: cargo install --locked cargo-shear
      - name: cargo shear
        run: cargo shear

  frontend:
    name: Frontend (biome, typecheck, build)
    runs-on: docker
    container:
      image: node:20-bookworm
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('v2/frontend/pnpm-lock.yaml') }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Biome ci
        run: pnpm run ci

      - name: Build (also regenerates routeTree)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Vitest
        run: pnpm run test --passWithNoTests

  schema:
    name: Schema (atlas migrate diff)
    runs-on: docker
    container:
      image: node:20-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Install atlas
        run: curl -sSf https://atlasgo.sh | sh
      - name: Atlas migrate diff (must be empty)
        run: |
          OUT=$(atlas migrate diff --env dev 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "synced with the desired state"

  docker:
    name: Docker build
    runs-on: docker
    needs: [rust-fmt, rust-build, rust-test, rust-clippy, rust-shear, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t music-manager:ci v2
