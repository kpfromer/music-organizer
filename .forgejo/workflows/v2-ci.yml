name: v2-ci

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.forgejo/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.forgejo/workflows/v2-ci.yml'

jobs:
  rust:
    name: Rust (fmt, build, test, clippy, deny, audit)
    runs-on: docker
    container:
      image: rust:1.84-bookworm
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustup components
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny
        run: cargo deny check --hide-inclusion-graph

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        run: cargo audit
        continue-on-error: true

  frontend:
    name: Frontend (biome, typecheck, build)
    runs-on: docker
    container:
      image: node:20-bookworm
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack / pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('v2/frontend/pnpm-lock.yaml') }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Biome ci
        run: pnpm run ci

      - name: Build (also regenerates routeTree)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Vitest
        run: pnpm run test --passWithNoTests

  schema:
    name: Schema (atlas migrate diff)
    runs-on: docker
    container:
      image: arigaio/atlas:0.30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Atlas migrate diff (must be empty)
        run: |
          OUT=$(atlas migrate diff --env dev 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "synced with the desired state"

  docker:
    name: Docker build
    runs-on: docker
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t music-manager:ci v2
